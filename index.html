<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Engenharia</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { margin-bottom: 30px; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; }
        h1 { color: #1a365d; margin: 0; font-size: 28px; }
        p { color: #718096; margin: 5px 0 0 0; }
        .cards { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); flex: 1; min-width: 220px; border-left: 5px solid #3182ce; }
        .card.success { border-left-color: #38a169; }
        .card.warning { border-left-color: #dd6b20; }
        .card h3 { margin: 0 0 10px 0; color: #718096; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .card .value { font-size: 26px; font-weight: bold; color: #2d3748; }
        .progress-bar { background: #edf2f7; border-radius: 4px; height: 10px; margin-top: 12px; overflow: hidden; }
        .progress-fill { background: #38a169; height: 100%; width: 75%; }
        .chart-placeholder { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; border: 2px dashed #cbd5e0; }
        .chart-placeholder h4 { margin: 0 0 10px 0; color: #4a5568; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Painel de Controle de Projetos</h1>
            <p>Status report automatizado via GitHub Pages</p>
        </header>
        
        <div class="cards">
            <div class="card">
                <h3>Orçamento Alocado</h3>
                <div class="value">R$ 150.000,00</div>
            </div>
            <div class="card success">
                <h3>Progresso Físico</h3>
                <div class="value">75%</div>
                <div class="progress-bar"><div class="progress-fill"></div></div>
            </div>
            <div class="card warning">
                <h3>Restrições Ativas</h3>
                <div class="value">3</div>
            </div>
        </div>

        <div class="chart-placeholder">
            <h4>Gráfico de Evolução / Avanço</h4>
            <p style="font-size: 14px;">[Pronto para futuras integrações com bibliotecas JavaScript ou embeds de relatórios]</p>
        </div>
    </div>
</body>
</html>
